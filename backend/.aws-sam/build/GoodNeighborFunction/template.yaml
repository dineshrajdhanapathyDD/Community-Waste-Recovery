AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Good Neighbor Agent backend — one Lambda serving all community waste-recovery
  tools (surplus, catalog, needs, pantry, volunteers, vehicles, guidelines)
  behind an HTTP API Gateway. Data is bundled with the function from
  backend/data. Open (no auth) so it is directly testable; the AgentCore
  Gateway layer adds SigV4/OAuth2 auth on top when these are registered as
  gateway targets.

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 128
    Timeout: 10

Resources:
  GoodNeighborApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - "Authorization"
          - "Content-Type"
        AllowMethods:
          - GET
          - POST
          - OPTIONS

  GoodNeighborFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: good-neighbor-backend
      Handler: lambda_function.handler
      CodeUri: .
      Description: All Good Neighbor backend tools, routed by path.
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref GoodNeighborApi
            Path: /
            Method: GET
        Catalog:
          Type: HttpApi
          Properties:
            ApiId: !Ref GoodNeighborApi
            Path: /catalog
            Method: GET
        Needs:
          Type: HttpApi
          Properties:
            ApiId: !Ref GoodNeighborApi
            Path: /needs
            Method: GET
        Pantry:
          Type: HttpApi
          Properties:
            ApiId: !Ref GoodNeighborApi
            Path: /pantry
            Method: GET
        Volunteers:
          Type: HttpApi
          Properties:
            ApiId: !Ref GoodNeighborApi
            Path: /volunteers
            Method: GET
        VolunteerById:
          Type: HttpApi
          Properties:
            ApiId: !Ref GoodNeighborApi
            Path: /volunteers/{volunteer_id}
            Method: GET
        Vehicles:
          Type: HttpApi
          Properties:
            ApiId: !Ref GoodNeighborApi
            Path: /vehicles
            Method: GET
        VehicleById:
          Type: HttpApi
          Properties:
            ApiId: !Ref GoodNeighborApi
            Path: /vehicles/{vehicle_id}
            Method: GET
        GuidelinesGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref GoodNeighborApi
            Path: /guidelines
            Method: GET
        GuidelinesPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref GoodNeighborApi
            Path: /guidelines
            Method: POST
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref GoodNeighborApi
            Path: /health
            Method: GET

Outputs:
  ApiBaseUrl:
    Description: Base URL of the deployed Good Neighbor backend API
    Value: !Sub "https://${GoodNeighborApi}.execute-api.${AWS::Region}.amazonaws.com"
  FunctionName:
    Description: Lambda function name
    Value: !Ref GoodNeighborFunction
